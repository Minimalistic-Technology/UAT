name: Deploy Job Portal

on:
  push:
    branches:
      - main-job-portal

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd UAT/services/job-portal
            git fetch origin
            git clean -fd
            git reset --hard HEAD
            git checkout -B main-job-portal origin/main-job-portal
            git reset --hard origin/main-job-portal
            docker-compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker image prune -f