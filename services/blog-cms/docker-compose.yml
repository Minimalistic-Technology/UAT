services:
  blog-cms-db:
    image: postgres:16-alpine
    container_name: blog-cms-db
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-strapi}
      POSTGRES_DB: ${DATABASE_NAME:-strapi}
    ports:
      - "5432:5432"
    volumes:
      - blog_cms_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-strapi} -d ${DATABASE_NAME:-strapi}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  blog-cms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog-cms
    ports:
      # Host port is only exposed for the host-level nginx reverse proxy to reach.
      # Change the host side (left of the colon) if 1337 is already taken by another service.
      - "1337:1337"
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=blog-cms-db
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME:-strapi}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-strapi}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-strapi}
      - DATABASE_SSL=false
    restart: always
    volumes:
      - blog_cms_uploads:/opt/app/public/uploads
    depends_on:
      blog-cms-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:1337/_health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  blog-frontend:
    build:
      context: ../blog-frontend
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time - change this when the CMS domain changes,
        # then rebuild (docker-compose up -d --build).
        NEXT_PUBLIC_CMS_URL: ${NEXT_PUBLIC_CMS_URL:-https://cms.rajmane.dev}
    container_name: blog-frontend
    ports:
      - "3001:3000"
    env_file:
      - ../blog-frontend/.env
    environment:
      - NODE_ENV=production
      - INTERNAL_CMS_URL=http://blog-cms:1337
    restart: always
    depends_on:
      blog-cms:
        condition: service_healthy

volumes:
  blog_cms_uploads:
  blog_cms_db_data:


