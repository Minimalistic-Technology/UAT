services:
  blog-cms-db:
    image: postgres:17-alpine
    container_name: blog-cms-db
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-strapi}
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-strapi}
    ports:
      - "5435:5432"
    volumes:
      - blog_cms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-strapi} -d ${DATABASE_NAME:-strapi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  blog-cms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog-cms
    ports:
      # Host port is only exposed for the host-level nginx reverse proxy to reach.
      # Change the host side (left of the colon) if 1337 is already taken by another service.
      - "1337:1337"
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=blog-cms-db
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME:-strapi}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-strapi}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-strapi}
      - DATABASE_SSL=false
    restart: always
    volumes:
      - blog_cms_uploads:/opt/app/public/uploads
    depends_on:
      blog-cms-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:1337/_health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  blog_cms_uploads:
  blog_cms_postgres_data:
