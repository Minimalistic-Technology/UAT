services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ddtec-backend
    restart: always
    ports:
      - "5007:5007"
    environment:
      - PORT=5007
      # Add other crucial environment variables below or use env_file:
      # - JWT_SECRET=your_jwt_secret
    env_file:
      - ./backend/.env
    networks:
      - web

networks:
  web:
    external: true
