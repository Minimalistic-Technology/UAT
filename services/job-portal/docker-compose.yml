services:
  postgres:
    image: postgres:15-alpine
    container_name: job_portal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: job_portal
    ports:
      - "5432:5432"
    volumes:
      - job_portal_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d job_portal"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job_portal_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://user:password@postgres:5432/job_portal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  job_portal_data:
