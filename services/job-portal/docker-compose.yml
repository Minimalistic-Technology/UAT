services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job_portal_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      # Override the local connection string to use the mongodb container
      - MONGO_URI=mongodb://mongodb:27017/job-portal?replicaSet=rs0
      - PORT=5000
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: job_portal_frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      # INTERNAL_API_URL is used by server-side code (like NextAuth) to reach the backend inside the docker network
      - INTERNAL_API_URL=http://backend:5000/api
      # NEXTAUTH_URL is required by NextAuth
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
