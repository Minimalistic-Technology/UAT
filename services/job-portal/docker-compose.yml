version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: job_portal_mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job_portal_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      # Override the local connection string to use the mongodb container
      - MONGO_URI=mongodb://mongodb:27017/job-portal?replicaSet=rs0
      - PORT=5000
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: job_portal_frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      # Setting NEXT_PUBLIC_API_URL as localhost ensures the client browser can reach it.
      - NEXT_PUBLIC_API_URL=http://backend:5000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
