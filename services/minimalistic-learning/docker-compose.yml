version: '3.8'

services:
  backend:
    build:
      context: ./ml-backend
      dockerfile: Dockerfile
    container_name: ml-backend
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      # Note: Add the rest of your backend .env variables here OR ensure the ml-backend/.env is used.
      - REDIS_URL=redis://redis:6379
    env_file:
      - ./ml-backend/.env
    restart: always
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: ml-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  frontend:
    build:
      context: ./ml-starter-project
      dockerfile: Dockerfile
    container_name: ml-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

volumes:
  redis_data:
